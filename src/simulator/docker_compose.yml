services:
  client-simulator-1:
    build:
      context: ./client-node
      dockerfile: Dockerfile
    container_name: client_node_1
    environment:
      - CLIENT_NODE_ID=Client Node 1
    ports:
      - "8010:8000"
    restart: always
    networks:
      - agnostic-observability-platform_monitor-net

  client-simulator-2:
    build:
      context: ./client-node
      dockerfile: Dockerfile
    container_name: client_node_2
    environment:
      - CLIENT_NODE_ID=Client Node 2
    ports:
      - "8011:8000"
    restart: always
    networks:
      - agnostic-observability-platform_monitor-net

  client-simulator-3:
    build:
      context: ./client-node
      dockerfile: Dockerfile
    container_name: client_node_3
    environment:
      - CLIENT_NODE_ID=Client Node 3
    ports:
      - "8012:8000"
    restart: always
    networks:
      - agnostic-observability-platform_monitor-net

  client-control-plane:
    build:
      context: ./client-control-plane
      dockerfile: Dockerfile
    container_name: client_control_plane
    ports:
      - "3000:80"
    restart: always
    networks:
      - agnostic-observability-platform_monitor-net

networks:
  agnostic-observability-platform_monitor-net:
    external: true

